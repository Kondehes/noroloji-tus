name: VIP Noroloji Cikmis Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Java ve Android SDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: VIP Noroloji Master APK Derle (Offline Gomulu Veri)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p app/src/main/java/com/vip/noroloji
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle
          rootProject.name = "VIPNoroloji"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.vip.noroloji'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vip.noroloji.master"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "7.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="VIP Nöroloji Master"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/vip/noroloji/MainActivity.java
          package com.vip.noroloji;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>VIP Nöroloji Master</title>
          <style>
            :root { --bg:#0b1120; --card:#131c31; --card2:#1a2540; --accent:#38bdf8; --gold:#f59e0b; --green:#10b981; --red:#ef4444; --text:#f1f5f9; --muted:#94a3b8; }
            * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
            body { background:var(--bg); color:var(--text); padding-bottom:76px; }
            .header { position:sticky; top:0; z-index:50; background:rgba(11,17,32,0.96); backdrop-filter:blur(10px); padding:12px 14px; border-bottom:1px solid #1e293b; }
            .top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
            .title { font-size:17px; font-weight:800; color:var(--accent); }
            .badge { background:#1e293b; color:var(--gold); font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; border:1px solid #334155; }
            .search-box { width:100%; background:var(--card); border:1px solid #334155; color:var(--text); padding:10px 13px; border-radius:12px; font-size:14px; outline:none; }
            .search-box:focus { border-color:var(--accent); }
            .tabs { display:flex; gap:8px; margin-top:10px; }
            .tab { flex:1; text-align:center; padding:8px; border-radius:10px; background:var(--card); color:var(--muted); font-size:12px; font-weight:700; border:1px solid #1e293b; cursor:pointer; }
            .tab.active { background:var(--accent); color:#0b1120; border-color:var(--accent); }
            .container { padding:12px 14px; }
            .slayt-grid { display:grid; grid-template-columns:1fr; gap:10px; }
            .slayt-card { background:var(--card); border:1px solid #1e293b; border-radius:14px; padding:14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
            .slayt-name { font-size:14px; font-weight:700; color:var(--text); }
            .slayt-counts { display:flex; gap:6px; margin-top:5px; }
            .pill-t { background:rgba(56,189,248,0.15); color:var(--accent); font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; }
            .pill-s { background:rgba(245,158,11,0.15); color:var(--gold); font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; }
            .back-bar { display:flex; align-items:center; justify-content:space-between; background:var(--card2); padding:10px 12px; border-radius:12px; margin-bottom:12px; border:1px solid #334155; }
            .back-btn { background:var(--accent); color:#0b1120; border:none; padding:6px 12px; border-radius:8px; font-weight:800; font-size:12px; cursor:pointer; }
            .q-card { background:var(--card); border:1px solid #1e293b; border-radius:14px; padding:14px; margin-bottom:12px; }
            .q-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:11px; color:var(--muted); }
            .q-text { font-size:14px; line-height:1.55; font-weight:600; margin-bottom:12px; white-space:pre-line; }
            .opt-btn { width:100%; text-align:left; background:var(--card2); color:var(--text); border:1px solid #334155; border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; line-height:1.4; cursor:pointer; }
            .opt-btn.correct { background:rgba(16,185,129,0.22); border-color:var(--green); color:#a7f3d0; font-weight:700; }
            .opt-btn.wrong { background:rgba(239,68,68,0.22); border-color:var(--red); color:#fecaca; }
            .exp-box { display:none; margin-top:10px; background:#0f172a; border-left:3px solid var(--green); padding:11px 12px; border-radius:8px; font-size:13px; line-height:1.55; color:#e2e8f0; white-space:pre-line; }
            .exp-box.show { display:block; }
            .sozlu-btn { width:100%; background:rgba(245,158,11,0.18); color:var(--gold); border:1px solid var(--gold); padding:10px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; }
            .slayt-box { background:var(--card); border:1px solid #1e293b; border-radius:14px; padding:14px; margin-bottom:12px; }
            .slayt-box h3 { color:var(--accent); font-size:14px; margin-bottom:8px; }
            .slayt-box pre { white-space:pre-wrap; font-size:12.5px; line-height:1.5; color:#cbd5e1; max-height:260px; overflow-y:auto; }
          </style>
          </head>
          <body>
          <div class="header">
            <div class="top-row">
              <div class="title">🧠 VIP NÖROLOJİ MASTER</div>
              <div class="badge" id="statsBadge">Yükleniyor...</div>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Kelime ara (örn: inme, migren, trombolitik, Babinski)..." oninput="render()">
            <div class="tabs">
              <div class="tab active" id="tabAll" onclick="setMode('ALL')">Tümü</div>
              <div class="tab" id="tabTeorik" onclick="setMode('TEORİK')">Teorik Quiz</div>
              <div class="tab" id="tabSozlu" onclick="setMode('SÖZLÜ')">Sözlü Soruları</div>
              <div class="tab" id="tabSlayt" onclick="setMode('SLAYT')">Slayt Özeti</div>
            </div>
          </div>

          <div class="container" id="mainContainer"></div>

          <script>
          const GROQ_KEY = __GROQ_KEY_JSON__;
          const ALL_Q = __ALL_Q_JSON__;
          const SLAYT_TEXT = __SLAYT_TEXT_JSON__;
          let MODE = "ALL";
          let SELECTED_SLAYT = null;
          let CURRENT_LIST = [];

          function init() {
            const tCount = ALL_Q.filter(x => x.tur === "TEORİK").length;
            const sCount = ALL_Q.filter(x => x.tur === "SÖZLÜ").length;
            document.getElementById("statsBadge").innerText = `${tCount} Teorik • ${sCount} Sözlü`;
            render();
          }

          function findRelevantSlide(text) {
            if (!SLAYT_TEXT) return "";
            const words = text.toLowerCase().replace(/[^a-zçğıöşü\s]/g," ").split(/\s+/).filter(w => w.length > 4);
            const parts = SLAYT_TEXT.split("=== KONU:").slice(1);
            let best = "", bestScore = 0;
            parts.forEach(p => {
              const low = p.toLowerCase();
              let score = 0;
              words.slice(0,8).forEach(w => { if (low.includes(w)) score++; });
              if (score > bestScore) { bestScore = score; best = p.slice(0, 2600); }
            });
            return best;
          }

          async function askGroqExplanation(qObj, chosenLetter, expEl, cardEl) {
            const cacheKey = "vip_noro_exp_" + qObj.soru.slice(0,45);
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
              applyExplanation(qObj, chosenLetter, cached, expEl, cardEl);
              return;
            }
            expEl.classList.add("show");
            expEl.innerHTML = "⏳ <b>23 Slayt kaynağı taranıyor ve TUS/Hoca cevabı hazırlanıyor...</b>";
            const slideCtx = findRelevantSlide(qObj.soru + " " + (qObj.siklar||[]).join(" "));
            const prompt = qObj.tur === "TEORİK"
              ? `İnönü Tıp Dönem 5 Nöroloji çıkmış sorusunu slayt kaynağına göre çöz.\nSoru: ${qObj.soru}\nŞıklar: ${(qObj.siklar||[]).join(" | ")}\nÖnceden işaretli harf: ${qObj.dogru_harf || 'Bilinmiyor'}\nİlgili Ders Slaytı:\n${slideCtx}\n\nİlk satıra SADECE 'DOĞRU ŞIK: X' (X yerine A/B/C/D/E) yaz. Ardından 'MEKANİZMA VE SLAYT NOTU:' ve 'SINAV TUZAĞI:' başlıklarıyla net, öğretici açıklama yaz.`
              : `İnönü Tıp Dönem 5 Nöroloji sözlü/pratik hoca sorusuna slayt kaynağına göre tam puanlık cevap ver.\nSoru: ${qObj.soru}\nİlgili Ders Slaytı:\n${slideCtx}\n\n'HOCANIN DUYMAK İSTEDİĞİ MADDELER:' ve 'SLAYT KRİTİK NOTU:' başlıklarıyla maddeli, net açıklama yaz.`;

            try {
              const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": "Bearer " + GROQ_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({
                  model: "llama-3.3-70b-versatile",
                  temperature: 0.15,
                  max_tokens: 900,
                  messages: [{ role: "user", content: prompt }]
                })
              });
              const data = await res.json();
              const ans = data.choices[0].message.content.trim();
              localStorage.setItem(cacheKey, ans);
              applyExplanation(qObj, chosenLetter, ans, expEl, cardEl);
            } catch(e) {
              expEl.innerHTML = "⚠️ İnternet bağlantısı kontrol edilsin. (Hata: " + e.message + ")";
            }
          }

          function applyExplanation(qObj, chosenLetter, ans, expEl, cardEl) {
            if (qObj.tur === "TEORİK") {
              const m = ans.match(/DOĞRU\s*ŞIK\s*:\s*([A-E])/i);
              const correct = (m ? m[1].toUpperCase() : qObj.dogru_harf) || "";
              if (cardEl && correct) {
                cardEl.querySelectorAll(".opt-btn").forEach(b => {
                  const l = b.getAttribute("data-letter");
                  if (l === correct) b.classList.add("correct");
                  else if (l === chosenLetter) b.classList.add("wrong");
                });
              }
            }
            expEl.classList.add("show");
            expEl.innerText = ans;
          }

          function handleOptionClick(idx, chosenLetter) {
            const qObj = CURRENT_LIST[idx];
            const cardEl = document.getElementById("qcard_" + idx);
            const expEl = document.getElementById("exp_" + idx);
            if (qObj.dogru_harf) {
              cardEl.querySelectorAll(".opt-btn").forEach(b => {
                const l = b.getAttribute("data-letter");
                if (l === qObj.dogru_harf) b.classList.add("correct");
                else if (l === chosenLetter) b.classList.add("wrong");
              });
            }
            askGroqExplanation(qObj, chosenLetter, expEl, cardEl);
          }

          function handleSozluClick(idx) {
            const qObj = CURRENT_LIST[idx];
            const expEl = document.getElementById("exp_" + idx);
            if (expEl.classList.contains("show")) {
              expEl.classList.remove("show");
            } else {
              askGroqExplanation(qObj, "", expEl, null);
            }
          }

          function setMode(m) {
            MODE = m;
            ["tabAll","tabTeorik","tabSozlu","tabSlayt"].forEach(id => document.getElementById(id).classList.remove("active"));
            if(m==="ALL") document.getElementById("tabAll").classList.add("active");
            if(m==="TEORİK") document.getElementById("tabTeorik").classList.add("active");
            if(m==="SÖZLÜ") document.getElementById("tabSozlu").classList.add("active");
            if(m==="SLAYT") document.getElementById("tabSlayt").classList.add("active");
            render();
          }

          function openSlayt(name) { SELECTED_SLAYT = name; render(); window.scrollTo(0,0); }
          function closeSlayt() { SELECTED_SLAYT = null; render(); }

          function render() {
            const box = document.getElementById("mainContainer");
            const query = document.getElementById("searchInput").value.trim().toLowerCase();

            if (MODE === "SLAYT") {
              const bolumler = SLAYT_TEXT.split("=== KONU:").slice(1);
              let html = "";
              bolumler.forEach(b => {
                const lines = b.split("\n");
                const baslik = lines[0].replace("===","").trim();
                const icerik = lines.slice(1).join("\n").trim();
                if (!query || baslik.toLowerCase().includes(query) || icerik.toLowerCase().includes(query)) {
                  html += `<div class="slayt-box"><h3>📑 ${baslik}</h3><pre>${icerik.slice(0, 8000)}</pre></div>`;
                }
              });
              box.innerHTML = html || "<p style='color:#94a3b8'>Slayt bulunamadı.</p>";
              return;
            }

            if (query.length > 0 || SELECTED_SLAYT !== null) {
              CURRENT_LIST = ALL_Q.filter(q => {
                if (MODE !== "ALL" && q.tur !== MODE) return false;
                if (SELECTED_SLAYT && query.length === 0 && q.slayt_baslik !== SELECTED_SLAYT) return false;
                if (query.length > 0) {
                  const hay = (q.slayt_baslik + " " + q.soru + " " + (q.siklar||[]).join(" ")).toLowerCase();
                  return hay.includes(query);
                }
                return true;
              });

              let headerBar = "";
              if (SELECTED_SLAYT && query.length === 0) {
                headerBar = `<div class="back-bar"><div><div style="font-size:14px;font-weight:800;color:#38bdf8">${SELECTED_SLAYT}</div><div style="font-size:11px;color:#94a3b8">${CURRENT_LIST.length} soru listeleniyor</div></div><button class="back-btn" onclick="closeSlayt()">← Slaytlar</button></div>`;
              } else if (query.length > 0) {
                headerBar = `<div class="back-bar"><div style="font-size:13px;font-weight:700;color:#f59e0b">"${query}" araması için ${CURRENT_LIST.length} sonuç</div>${SELECTED_SLAYT ? '<button class="back-btn" onclick="closeSlayt()">← Slaytlar</button>' : ''}</div>`;
              }

              if (CURRENT_LIST.length === 0) {
                box.innerHTML = headerBar + "<p style='color:#94a3b8;text-align:center;margin-top:30px'>Bu filtrede soru bulunamadı.</p>";
                return;
              }

              let html = headerBar;
              CURRENT_LIST.forEach((q, idx) => {
                const isTeorik = q.tur === "TEORİK";
                const badge = isTeorik ? `<span class="pill-t">TEORİK</span>` : `<span class="pill-s">SÖZLÜ</span>`;
                html += `<div class="q-card" id="qcard_${idx}">
                  <div class="q-meta"><span>📂 ${q.slayt_baslik}</span>${badge}</div>
                  <div class="q-text">${idx+1}. ${q.soru}</div>`;

                if (isTeorik && q.siklar && q.siklar.length > 0) {
                  q.siklar.forEach(opt => {
                    const letter = opt.trim().charAt(0).toUpperCase();
                    html += `<button class="opt-btn" data-letter="${letter}" onclick="handleOptionClick(${idx}, '${letter}')">${opt}</button>`;
                  });
                  html += `<div class="exp-box" id="exp_${idx}"></div>`;
                } else {
                  html += `<button class="sozlu-btn" onclick="handleSozluClick(${idx})">👨‍⚕️ Hocanın Cevabını & Slayt Notunu Gör</button>
                  <div class="exp-box" id="exp_${idx}" style="border-left-color:#f59e0b"></div>`;
                }
                html += `</div>`;
              });
              box.innerHTML = html;
              return;
            }

            const groups = {};
            ALL_Q.forEach(q => {
              if (MODE !== "ALL" && q.tur !== MODE) return;
              if (!groups[q.slayt_baslik]) groups[q.slayt_baslik] = { t:0, s:0 };
              if (q.tur === "TEORİK") groups[q.slayt_baslik].t++;
              else groups[q.slayt_baslik].s++;
            });

            const names = Object.keys(groups).sort((a,b) => (groups[b].t + groups[b].s) - (groups[a].t + groups[a].s));
            let html = `<div class="slayt-grid">`;
            names.forEach(name => {
              const g = groups[name];
              html += `<div class="slayt-card" onclick="openSlayt('${name.replace(/'/g,"\\'")}')">
                <div>
                  <div class="slayt-name">📑 ${name}</div>
                  <div class="slayt-counts">
                    ${g.t > 0 ? `<span class="pill-t">${g.t} Teorik</span>` : ''}
                    ${g.s > 0 ? `<span class="pill-s">${g.s} Sözlü</span>` : ''}
                  </div>
                </div>
                <div style="color:#38bdf8;font-size:18px;font-weight:800">›</div>
              </div>`;
            });
            html += `</div>`;
            box.innerHTML = html || "<p style='color:#94a3b8'>Arşiv henüz yüklenmedi.</p>";
          }

          init();
          </script>
          </body>
          </html>
          EOF

          python3 - << 'PYEOF'
          import os, json

          groq_key = os.environ.get("GROQ_API_KEY", "").strip()
          sorular = []
          if os.path.isfile("cikmis_arsiv.json"):
              with open("cikmis_arsiv.json", "r", encoding="utf-8", errors="ignore") as f:
                  sorular = json.load(f).get("sorular", [])

          slayt_txt = ""
          if os.path.isfile("noroloji_kaynak.txt"):
              with open("noroloji_kaynak.txt", "r", encoding="utf-8", errors="ignore") as f:
                  slayt_txt = f.read()

          with open("app/src/main/assets/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          html = html.replace("__GROQ_KEY_JSON__", json.dumps(groq_key))
          html = html.replace("__ALL_Q_JSON__", json.dumps(sorular, ensure_ascii=False).replace("</script>", "<\\/script>"))
          html = html.replace("__SLAYT_TEXT_JSON__", json.dumps(slayt_txt, ensure_ascii=False).replace("</script>", "<\\/script>"))

          with open("app/src/main/assets/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print(f"HTML icine {len(sorular)} soru ve {len(slayt_txt)} karakter slayt gomuldu!")
          PYEOF

          gradle assembleDebug --no-daemon

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: VIP-Noroloji-Cikmis-Master-v7
          path: app/build/outputs/apk/debug/app-debug.apk
