name: VIP Noroloji Cikmis Master APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ortam Hazirla
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Uygulama Kodunu Olustur
        run: |
          mkdir -p app/src/main/java/com/vip/noromaster
          mkdir -p app/src/main/assets

          if [ -f cikmis_arsiv.json ]; then
            cp cikmis_arsiv.json app/src/main/assets/cikmis_arsiv.json
          else
            echo '{"toplam":0,"sorular":[]}' > app/src/main/assets/cikmis_arsiv.json
          fi

          if [ -f noroloji_kaynak.txt ]; then
            cp noroloji_kaynak.txt app/src/main/assets/noroloji_kaynak.txt
          else
            echo '' > app/src/main/assets/noroloji_kaynak.txt
          fi

          cat << 'EOF' > settings.gradle
          rootProject.name = "VIPNorolojiMaster"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vip.noromaster'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vip.noromaster"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-CIKMIS-MASTER"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="VIP Nöroloji Master" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/vip/noromaster/MainActivity.java
          package com.vip.noromaster;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>VIP Nöroloji Master</title>
          <style>
            :root { --bg:#090d16; --card:#111827; --card2:#1a2234; --accent:#2dd4bf; --green:#22c55e; --red:#ef4444; --gold:#f59e0b; --purple:#a855f7; --text:#f1f5f9; --muted:#94a3b8; }
            * { box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
            body { margin:0; background:var(--bg); color:var(--text); padding:12px 12px 84px 12px; }
            .header { display:flex; justify-content:space-between; align-items:center; padding:8px 4px 12px 4px; border-bottom:1px solid #1e293b; }
            .header h1 { margin:0; font-size:18px; color:var(--accent); }
            .badge { background:#1e293b; color:var(--gold); padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; }
            .card { background:var(--card); border:1px solid #1e293b; border-radius:14px; padding:14px; margin-top:12px; }
            .sec-title { font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:8px; display:block; }
            input, textarea { width:100%; background:#0f172a; border:1px solid #334155; color:var(--text); padding:11px 12px; border-radius:10px; font-size:14px; margin-bottom:8px; }
            .btn { width:100%; border:none; padding:11px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer; }
            .btn-primary { background:linear-gradient(135deg,#0d9488,#2dd4bf); color:#041f1c; }
            .btn-gold { background:linear-gradient(135deg,#d97706,#f59e0b); color:#04101f; }
            .btn-purple { background:linear-gradient(135deg,#7e22ce,#a855f7); color:#fff; }
            .btn-outline { background:#0f172a; border:1px solid #334155; color:#cbd5e1; }
            .btn-sm { padding:7px 11px; font-size:12px; width:auto; }

            .tur-bar { display:flex; gap:8px; margin-bottom:10px; }
            .tur-btn { flex:1; padding:11px 8px; border-radius:10px; border:1.5px solid #334155; background:#0f172a; color:#cbd5e1; font-weight:700; font-size:13px; cursor:pointer; text-align:center; }
            .tur-btn.active-teorik { background:#042f2e; border-color:var(--accent); color:var(--accent); }
            .tur-btn.active-sozlu { background:#2e1065; border-color:var(--purple); color:#e9d5ff; }
            .tur-btn.active-hepsi { background:#271c08; border-color:var(--gold); color:#fde68a; }

            .chip-scroll { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
            .chip { background:#0f172a; border:1px solid #334155; color:#cbd5e1; padding:7px 10px; border-radius:9px; font-size:12px; cursor:pointer; }
            .chip.active { background:#0d9488; border-color:var(--accent); color:#041f1c; font-weight:700; }
            .chip.alt { background:#1e1b4b; border-color:#4c1d95; color:#ddd6fe; }
            .chip.alt.active { background:#7e22ce; border-color:var(--purple); color:#fff; font-weight:700; }

            .soru-kart { background:var(--card2); border:1px solid #283655; border-radius:12px; padding:13px; margin-bottom:10px; }
            .soru-ust { display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
            .etiket-konu { font-size:11px; color:var(--accent); font-weight:700; background:#042f2e; padding:3px 8px; border-radius:6px; }
            .etiket-tur { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
            .tur-teorik { background:#1e293b; color:var(--gold); }
            .tur-sozlu { background:#3b0764; color:#f3e8ff; }
            .soru-govde { font-size:14.5px; line-height:1.55; color:#f1f5f9; white-space:pre-line; margin-bottom:10px; }
            .cevap-panel { background:#090d16; border-left:4px solid var(--green); padding:10px 12px; border-radius:8px; margin-top:8px; font-size:13.5px; line-height:1.55; color:#bbf7d0; white-space:pre-line; }

            .cevap-kutu { background:#0f172a; border:1px solid #283655; border-radius:14px; padding:15px; margin-top:12px; font-size:14px; line-height:1.65; }
            .cevap-kutu h3 { color:var(--accent); font-size:15px; margin:12px 0 6px 0; padding-bottom:4px; border-bottom:1px solid #1e293b; }
            .cevap-kutu h3:first-child { margin-top:0; }
            .cevap-kutu ul { margin:6px 0 10px 0; padding-left:18px; }
            .cevap-kutu li { margin-bottom:6px; color:#e2e8f0; }
            .cevap-kutu strong { color:#5eead4; }
            .spot-banner { background:linear-gradient(135deg,#271c08,#1e1b0d); border:1px solid #b45309; border-left:4px solid var(--gold); border-radius:10px; padding:11px 12px; margin-top:12px; color:#fef3c7; font-size:13.5px; }

            .nav { position:fixed; bottom:0; left:0; right:0; background:#060911; border-top:1px solid #1e293b; display:flex; justify-content:space-around; padding:8px 4px; z-index:99; }
            .nav-btn { background:none; border:none; color:var(--muted); font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; flex:1; }
            .nav-btn.active { color:var(--accent); }
            .nav-btn span { font-size:18px; }
            .hidden { display:none !important; }
            .durum { font-size:12px; color:var(--gold); margin-top:8px; text-align:center; }
          </style>
          </head>
          <body>

          <div class="header">
            <div>
              <h1>🧠 VIP NÖROLOJİ ÇIKMIŞ</h1>
              <div style="font-size:11px;color:var(--muted)">Başlıklandırılmış Çıkmış Arşivi + Slayt Danışmanı</div>
            </div>
            <div class="badge" id="toplamRozet">0 SORU</div>
          </div>

          <!-- SEKME 1: ÇIKMIŞ SORU ARŞİVİ -->
          <div id="tab-arsiv">
            <div class="card">
              <input type="text" id="aramaInput" oninput="filtreleVeCiz()" placeholder="🔍 Ara (Örn: Migren, Wallenberg, GBS, BOS...)">

              <div class="tur-bar">
                <button class="tur-btn active-hepsi" id="btn-hepsi" onclick="turSec('HEPSİ')">📚 Tümü</button>
                <button class="tur-btn" id="btn-teorik" onclick="turSec('TEORİK')">📝 Teorik Sorular</button>
                <button class="tur-btn" id="btn-sozlu" onclick="turSec('SÖZLÜ')">🎤 Sözlü Soruları</button>
              </div>

              <span class="sec-title">1. Ana Başlıklar</span>
              <div class="chip-scroll" id="anaBaslikAlani"></div>

              <div id="altBaslikKutu" class="hidden">
                <span class="sec-title" style="color:#c084fc;margin-top:6px;">2. Alt Başlıklar</span>
                <div class="chip-scroll" id="altBaslikAlani"></div>
              </div>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 4px 8px 4px;">
              <span style="font-size:12px;color:var(--muted);font-weight:700;" id="sonucSayisi">Yükleniyor...</span>
              <button class="btn btn-outline btn-sm" onclick="tumCevaplariAcKapat()" id="topluCevapBtn">👁️ Tüm Cevapları Aç</button>
            </div>

            <div id="soruListesiAlani"></div>
          </div>

          <!-- SEKME 2: TAKILDIĞIM YER (SLAYTLARA GÖRE CEVAP) -->
          <div id="tab-sor" class="hidden">
            <div class="card">
              <span class="sec-title">💡 Takıldığım Yer (17 Slayta Göre Kısa Cevap)</span>
              <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Sorunu yaz; doğrudan 17 Nöroloji slaydındaki vurgulu notlara göre net özet getirsin:</div>
              <textarea id="takilanSoru" rows="3" placeholder="Örn: Migren profilaksisinde ilk tercih ilaçlar neler?"></textarea>
              <button class="btn btn-gold" onclick="slaytaSor()">⚡ Slaytlara Göre Cevapla</button>
              <div class="durum" id="danismanDurum"></div>
              <div id="danismanCevap" class="cevap-kutu hidden"></div>
            </div>

            <div class="card">
              <span class="sec-title">🔑 Groq API Anahtarı (1 Kez Kaydedilir)</span>
              <input type="password" id="groqKey" placeholder="Groq API Key (gsk_...)">
              <button class="btn btn-primary" onclick="ayarlariKaydet()">💾 Anahtarı Kaydet</button>
            </div>
          </div>

          <div class="nav">
            <button class="nav-btn active" id="nav-arsiv" onclick="sekmeAc('arsiv')"><span>📚</span>Çıkmış Sorular</button>
            <button class="nav-btn" id="nav-sor" onclick="sekmeAc('sor')"><span>💡</span>Slayta Sor</button>
          </div>

          <script>
          let TUM_SORULAR = [];
          let SLAYT_METIN = "";
          let seciliTur = "HEPSİ";
          let seciliAna = "TÜMÜ";
          let seciliAlt = "TÜMÜ";
          let topluAcik = false;

          window.onload = async () => {
            document.getElementById("groqKey").value = (localStorage.getItem("groq_key") || "").trim();
            try {
              const r = await fetch("cikmis_arsiv.json");
              if (r.ok) {
                const veri = await r.json();
                TUM_SORULAR = veri.sorular || [];
              }
            } catch (e) {}

            try {
              const rs = await fetch("noroloji_kaynak.txt");
              if (rs.ok) SLAYT_METIN = await rs.text();
            } catch (e) {}

            document.getElementById("toplamRozet").innerText = `${TUM_SORULAR.length} ÇIKMIŞ`;
            anaBasliklariCiz();
            filtreleVeCiz();
          };

          function sekmeAc(ad) {
            ["arsiv","sor"].forEach(s => {
              document.getElementById("tab-"+s).classList.toggle("hidden", s !== ad);
              document.getElementById("nav-"+s).classList.toggle("active", s === ad);
            });
          }

          function ayarlariKaydet() {
            const g = document.getElementById("groqKey").value.trim();
            localStorage.setItem("groq_key", g);
            alert("Groq anahtarı kaydedildi Şef!");
          }

          function turSec(tur) {
            seciliTur = tur;
            document.getElementById("btn-hepsi").className = "tur-btn" + (tur === "HEPSİ" ? " active-hepsi" : "");
            document.getElementById("btn-teorik").className = "tur-btn" + (tur === "TEORİK" ? " active-teorik" : "");
            document.getElementById("btn-sozlu").className = "tur-btn" + (tur === "SÖZLÜ" ? " active-sozlu" : "");
            filtreleVeCiz();
          }

          function anaBasliklariCiz() {
            const alan = document.getElementById("anaBaslikAlani");
            const sayim = {};
            TUM_SORULAR.forEach(q => {
              const a = q.ana_baslik || "Diğer";
              sayim[a] = (sayim[a] || 0) + 1;
            });
            const basliklar = ["TÜMÜ", ...Object.keys(sayim)];
            alan.innerHTML = "";
            basliklar.forEach(b => {
              const adet = b === "TÜMÜ" ? TUM_SORULAR.length : sayim[b];
              const c = document.createElement("div");
              c.className = "chip" + (seciliAna === b ? " active" : "");
              c.innerText = `${b} (${adet})`;
              c.onclick = () => {
                seciliAna = b;
                seciliAlt = "TÜMÜ";
                anaBasliklariCiz();
                altBasliklariCiz();
                filtreleVeCiz();
              };
              alan.appendChild(c);
            });
          }

          function altBasliklariCiz() {
            const kutu = document.getElementById("altBaslikKutu");
            const alan = document.getElementById("altBaslikAlani");
            if (seciliAna === "TÜMÜ") {
              kutu.classList.add("hidden");
              return;
            }
            const sayim = {};
            TUM_SORULAR.filter(q => (q.ana_baslik || "Diğer") === seciliAna).forEach(q => {
              const alt = q.alt_baslik || "Genel";
              sayim[alt] = (sayim[alt] || 0) + 1;
            });
            const altlar = ["TÜMÜ", ...Object.keys(sayim)];
            if (altlar.length <= 2) {
              kutu.classList.add("hidden");
              return;
            }
            kutu.classList.remove("hidden");
            alan.innerHTML = "";
            altlar.forEach(a => {
              const c = document.createElement("div");
              c.className = "chip alt" + (seciliAlt === a ? " active" : "");
              c.innerText = a === "TÜMÜ" ? "Tüm Alt Başlıklar" : `${a} (${sayim[a]})`;
              c.onclick = () => {
                seciliAlt = a;
                altBasliklariCiz();
                filtreleVeCiz();
              };
              alan.appendChild(c);
            });
          }

          function filtreleVeCiz() {
            const ara = document.getElementById("aramaInput").value.trim().toLowerCase();
            const suzulen = TUM_SORULAR.filter(q => {
              if (seciliTur !== "HEPSİ" && q.tur !== seciliTur) return false;
              if (seciliAna !== "TÜMÜ" && (q.ana_baslik || "Diğer") !== seciliAna) return false;
              if (seciliAlt !== "TÜMÜ" && (q.alt_baslik || "Genel") !== seciliAlt) return false;
              if (ara) {
                const havuz = `${q.ana_baslik} ${q.alt_baslik} ${q.soru} ${q.cevap}`.toLowerCase();
                if (!havuz.includes(ara)) return false;
              }
              return true;
            });

            document.getElementById("sonucSayisi").innerText = `Bulunan Çıkmış Soru: ${suzulen.length}`;
            const liste = document.getElementById("soruListesiAlani");
            liste.innerHTML = "";

            if (suzulen.length === 0) {
              liste.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);">Bu filtreye uygun çıkmış soru bulunamadı.</div>`;
              return;
            }

            suzulen.forEach((q, idx) => {
              const sozluMu = q.tur === "SÖZLÜ";
              const div = document.createElement("div");
              div.className = "soru-kart";
              div.innerHTML = `
                <div class="soru-ust">
                  <span class="etiket-konu">${q.ana_baslik || "Nöroloji"} › ${q.alt_baslik || "Genel"}</span>
                  <span class="etiket-tur ${sozluMu ? "tur-sozlu" : "tur-teorik"}">${sozluMu ? "🎤 SÖZLÜ" : "📝 TEORİK"}</span>
                </div>
                <div class="soru-govde">${escapeHtml(q.soru)}</div>
                <button class="btn ${sozluMu ? "btn-purple" : "btn-primary"} btn-sm" onclick="cevapToggle(${idx})">👁️ Cevabı Göster / Gizle</button>
                <div class="cevap-panel ${topluAcik ? "" : "hidden"}" id="cevap-${idx}"><b>✅ Cevap:</b>\n${escapeHtml(q.cevap)}</div>
              `;
              liste.appendChild(div);
            });
          }

          function escapeHtml(t) {
            return (t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          }

          function cevapToggle(idx) {
            document.getElementById("cevap-" + idx).classList.toggle("hidden");
          }

          function tumCevaplariAcKapat() {
            topluAcik = !topluAcik;
            document.getElementById("topluCevapBtn").innerText = topluAcik ? "🙈 Tüm Cevapları Gizle" : "👁️ Tüm Cevapları Aç";
            document.querySelectorAll(".cevap-panel").forEach(el => {
              el.classList.toggle("hidden", !topluAcik);
            });
          }

          function markdownToTemizHtml(md) {
            let lines = md.replace(/<br\s*\/?>/gi, "\n").split("\n");
            let html = "", inList = false;
            const fmt = (t) => escapeHtml(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            for (let raw of lines) {
              let line = raw.trim();
              if (!line || line === "---") { if (inList) { html += "</ul>"; inList = false; } continue; }
              if (line.startsWith("###") || line.startsWith("##")) {
                if (inList) { html += "</ul>"; inList = false; }
                html += `<h3>${fmt(line.replace(/^#+\s*/, ""))}</h3>`;
              } else if (line.includes("ALTIN SPOT")) {
                if (inList) { html += "</ul>"; inList = false; }
                html += `<div class="spot-banner">${fmt(line)}</div>`;
              } else if (line.startsWith("- ") || line.startsWith("* ")) {
                if (!inList) { html += "<ul>"; inList = true; }
                html += `<li>${fmt(line.slice(2))}</li>`;
              } else {
                if (inList) { html += "</ul>"; inList = false; }
                html += `<p>${fmt(line)}</p>`;
              }
            }
            if (inList) html += "</ul>";
            return html;
          }

          async function slaytaSor() {
            const soru = document.getElementById("takilanSoru").value.trim();
            const groq = (localStorage.getItem("groq_key") || "").trim();
            if (!soru) return alert("Sorunu yaz Şef!");
            if (!groq) return alert("Aşağıdan Groq API Key gir Şef (gsk_...)!");
            const durum = document.getElementById("danismanDurum");
            const kutu = document.getElementById("danismanCevap");
            durum.innerText = "🔍 17 Slayt taranıyor...";
            kutu.classList.add("hidden");

            const kelimeler = soru.toLowerCase().split(/\W+/).filter(w => w.length > 3);
            let ilgiliSlayt = "";
            if (SLAYT_METIN) {
              const satirlar = SLAYT_METIN.split("\n").filter(s => kelimeler.some(k => s.toLowerCase().includes(k)));
              const vurgulular = satirlar.filter(s => s.includes("VURGULU"));
              ilgiliSlayt = [...vurgulular, ...satirlar].slice(0, 18).join("\n").slice(0, 3500);
            }

            try {
              let model = "llama-3.3-70b-versatile";
              try {
                const mr = await fetch("https://api.groq.com/openai/v1/models", { headers: { "Authorization": `Bearer ${groq}` } });
                if (mr.ok) {
                  const ids = ((await mr.json()).data || []).map(x => x.id).filter(id => !id.includes("whisper") && !id.includes("guard") && !id.includes("tts"));
                  model = ids.find(id => id.includes("70b") || id.includes("120b") || id.includes("qwen")) || ids[0] || model;
                }
              } catch (me) {}

              const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${groq}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                  model: model,
                  temperature: 0.2,
                  max_tokens: 600,
                  messages: [
                    {
                      role: "system",
                      content: "Sen İnönü Tıp Dönem 5 Nöroloji Stajı eğitmenisin. SADECE verilen 17 slayt notuna dayanarak kısa ve net cevap ver. Tablo veya HTML kullanma. En fazla 130 kelimeyle şu formatta yaz:\n### 📌 Slaytlara Göre Cevap\n- (En fazla 4 net madde)\n⭐ ALTIN SPOT: (Tek cümlelik sınav spotu)"
                    },
                    { role: "user", content: `SORU: ${soru}\n\nSLAYT NOTLARI:\n${ilgiliSlayt}` }
                  ]
                })
              });
              const data = await r.json();
              if (data.choices && data.choices[0]) {
                durum.innerText = "";
                kutu.innerHTML = markdownToTemizHtml(data.choices[0].message.content);
                kutu.classList.remove("hidden");
              } else {
                durum.innerText = "❌ Hata: " + (data.error?.message || "Groq anahtarını kontrol et");
              }
            } catch (e) {
              durum.innerText = "❌ Bağlantı hatası: " + e.message;
            }
          }
          </script>
          </body>
          </html>
          EOF

          cat << 'EOF' > gradlew
          #!/bin/sh
          exec gradle "$@"
          EOF
          chmod +x gradlew

      - name: APK Derle
        run: gradle assembleDebug

      - name: VIP Noroloji APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: VIP-Noroloji-Cikmis-Master-v3
          path: app/build/outputs/apk/debug/app-debug.apk
