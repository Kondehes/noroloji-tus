name: VIP Noroloji Cikmis Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Java ve Android SDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: VIP Noroloji v9 APK Derle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p app/src/main/java/com/vip/noroloji
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle
          rootProject.name = "VIPNoroloji"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.vip.noroloji'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vip.noroloji.master"
                  minSdk 24
                  targetSdk 34
                  versionCode 9
                  versionName "9.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="VIP Nöroloji"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/vip/noroloji/MainActivity.java
          package com.vip.noroloji;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>VIP Nöroloji</title>
          <style>
            :root {
              --bg:#090d16; --card:#111827; --card2:#1e293b; --border:rgba(255,255,255,0.09);
              --blue:#3b82f6; --gold:#f59e0b; --green:#10b981; --red:#ef4444; --text:#f8fafc; --muted:#94a3b8;
            }
            * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
            body { background:var(--bg); color:var(--text); padding-bottom:40px; }
            .topbar { position:sticky; top:0; z-index:99; background:rgba(9,13,22,0.95); backdrop-filter:blur(12px); padding:12px 14px; border-bottom:1px solid var(--border); }
            .brand-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
            .brand { font-size:17px; font-weight:800; color:#60a5fa; }
            .pill { background:var(--card2); padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700; color:#e2e8f0; border:1px solid var(--border); }
            .search-wrap { position:relative; margin-bottom:10px; }
            .search-input { width:100%; background:var(--card); border:1px solid var(--border); color:var(--text); padding:11px 36px 11px 13px; border-radius:12px; font-size:14px; outline:none; }
            .search-input:focus { border-color:var(--blue); }
            .clear-btn { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:var(--card2); color:var(--muted); border:none; width:22px; height:22px; border-radius:50%; font-size:12px; display:none; cursor:pointer; }
            .tabs { display:grid; grid-template-columns:1fr 1fr 1.2fr; gap:6px; background:var(--card); padding:4px; border-radius:12px; border:1px solid var(--border); }
            .tab { text-align:center; padding:9px 4px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; }
            .tab.active { background:var(--blue); color:#fff; }
            .page { padding:12px 14px; max-width:860px; margin:0 auto; }
            .info-bar { font-size:12px; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
            .q-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px; margin-bottom:12px; }
            .q-stem { font-size:14.5px; line-height:1.58; font-weight:600; color:var(--text); margin-bottom:12px; white-space:pre-line; }
            .opt { width:100%; text-align:left; background:var(--card2); color:#e2e8f0; border:1px solid rgba(255,255,255,0.07); border-radius:11px; padding:11px 13px; margin-bottom:7px; font-size:13.5px; line-height:1.42; cursor:pointer; display:block; }
            .opt.correct { background:rgba(16,185,129,0.2); border-color:var(--green); color:#6ee7b7; font-weight:700; }
            .opt.wrong { background:rgba(239,68,68,0.2); border-color:var(--red); color:#fca5a5; }
            .ans-btn { width:100%; background:rgba(245,158,11,0.16); color:#fbbf24; border:1px solid rgba(245,158,11,0.4); padding:10px; border-radius:11px; font-size:13px; font-weight:700; cursor:pointer; }
            .ans-panel { display:none; margin-top:11px; background:#0b1120; border:1px solid rgba(59,130,246,0.25); border-left:4px solid var(--blue); padding:13px; border-radius:11px; font-size:13.5px; line-height:1.62; color:#e2e8f0; white-space:pre-line; }
            .ans-panel.open { display:block; }
            .ask-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px; }
            .ask-area { width:100%; min-height:110px; background:#0b1120; border:1px solid var(--border); color:var(--text); border-radius:12px; padding:12px; font-size:14px; outline:none; margin-bottom:10px; resize:vertical; }
            .ask-area:focus { border-color:var(--blue); }
            .ask-submit { width:100%; background:var(--blue); color:#fff; border:none; padding:12px; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; }
            .more-btn { width:100%; background:var(--card2); color:#60a5fa; border:1px solid var(--border); padding:12px; border-radius:12px; font-size:13.5px; font-weight:700; cursor:pointer; margin-top:6px; }
          </style>
          </head>
          <body>
          <div class="topbar">
            <div class="brand-row">
              <div class="brand">🧠 VIP NÖROLOJİ</div>
              <div class="pill" id="statsBadge">Hazırlanıyor...</div>
            </div>
            <div class="search-wrap" id="searchWrap">
              <input type="text" id="searchInput" class="search-input" placeholder="🔍 Ara (örn: inme, migren, trombolitik, Babinski)..." oninput="onSearch()">
              <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
            </div>
            <div class="tabs">
              <div class="tab active" id="tabTeorik" onclick="setMode('TEORİK')">Teorik</div>
              <div class="tab" id="tabSozlu" onclick="setMode('SÖZLÜ')">Sözlü</div>
              <div class="tab" id="tabAsk" onclick="setMode('ASK')">Soruma Cevap Ver</div>
            </div>
          </div>

          <div class="page" id="mainContainer"></div>

          <script>
          const GROQ_KEY = __GROQ_KEY_JSON__;
          const ALL_Q = __ALL_Q_JSON__;
          const SLAYT_TEXT = __SLAYT_TEXT_JSON__;
          let MODE = "TEORİK";
          let CURRENT_LIST = [];
          let SHOW_LIMIT = 60;
          let ACTIVE_MODEL = "";

          function init() {
            const tCount = ALL_Q.filter(x => x.tur === "TEORİK").length;
            const sCount = ALL_Q.filter(x => x.tur === "SÖZLÜ").length;
            document.getElementById("statsBadge").innerText = `${tCount} Teorik • ${sCount} Sözlü`;
            render();
          }

          function onSearch() {
            SHOW_LIMIT = 60;
            const val = document.getElementById("searchInput").value;
            document.getElementById("clearBtn").style.display = val.length > 0 ? "block" : "none";
            render();
          }

          function clearSearch() {
            document.getElementById("searchInput").value = "";
            document.getElementById("clearBtn").style.display = "none";
            SHOW_LIMIT = 60;
            render();
          }

          function findRelevantSlides(text) {
            if (!SLAYT_TEXT) return "";
            const words = text.toLowerCase().replace(/[^a-zçğıöşü\s]/g," ").split(/\s+/).filter(w => w.length > 3);
            const parts = SLAYT_TEXT.split("=== KONU:").slice(1);
            let scored = [];
            parts.forEach(p => {
              const low = p.toLowerCase();
              let score = 0;
              words.slice(0,12).forEach(w => { if (low.includes(w)) score++; });
              if (score > 0) scored.push({ score, txt: p.slice(0, 2200) });
            });
            scored.sort((a,b) => b.score - a.score);
            return scored.slice(0,2).map(x => x.txt).join("\n---\n");
          }

          async function getWorkingModel() {
            if (ACTIVE_MODEL) return ACTIVE_MODEL;
            try {
              const r = await fetch("https://api.groq.com/openai/v1/models", {
                headers: { "Authorization": "Bearer " + GROQ_KEY }
              });
              const d = await r.json();
              if (d && Array.isArray(d.data)) {
                const ids = d.data.map(m => m.id).filter(id => !id.includes("whisper") && !id.includes("guard") && !id.includes("tts"));
                for (const pref of ["llama-3.3-70b-versatile", "qwen", "llama-3.1-70b", "deepseek", "70b", "8b"]) {
                  const found = ids.find(id => id.includes(pref));
                  if (found) { ACTIVE_MODEL = found; return found; }
                }
                if (ids.length > 0) { ACTIVE_MODEL = ids[0]; return ids[0]; }
              }
            } catch(e) {}
            return "llama-3.3-70b-versatile";
          }

          async function callGroq(prompt, outEl, onSuccess) {
            outEl.classList.add("open");
            outEl.innerHTML = "⏳ <b>23 Slayt kaynağı inceleniyor ve detaylı açıklama hazırlanıyor...</b>";
            try {
              const modelName = await getWorkingModel();
              const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": "Bearer " + GROQ_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({
                  model: modelName,
                  temperature: 0.15,
                  max_tokens: 1000,
                  messages: [{ role: "user", content: prompt }]
                })
              });
              const data = await res.json();
              if (!res.ok || !data.choices || !data.choices[0] || !data.choices[0].message) {
                const errMsg = (data && data.error && data.error.message) ? data.error.message : ("HTTP " + res.status);
                outEl.innerHTML = "⚠️ API Uyarısı: " + errMsg;
                return;
              }
              const ans = data.choices[0].message.content.trim();
              outEl.innerText = ans;
              if (onSuccess) onSuccess(ans);
            } catch(e) {
              outEl.innerHTML = "⚠️ İnternet bağlantısı hatası: " + e.message;
            }
          }

          function handleOptionClick(idx, chosenLetter) {
            const qObj = CURRENT_LIST[idx];
            const cardEl = document.getElementById("qcard_" + idx);
            const expEl = document.getElementById("exp_" + idx);

            const markButtons = (correctLetter) => {
              if (!correctLetter) return;
              cardEl.querySelectorAll(".opt").forEach(b => {
                const l = b.getAttribute("data-letter");
                if (l === correctLetter) b.classList.add("correct");
                else if (l === chosenLetter) b.classList.add("wrong");
              });
            };

            if (qObj.dogru_harf) markButtons(qObj.dogru_harf);

            const cacheKey = "vip_v9_" + qObj.soru.slice(0,55);
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
              const m = cached.match(/DOĞRU\s*ŞIK\s*:\s*([A-E])/i);
              markButtons(m ? m[1].toUpperCase() : qObj.dogru_harf);
              expEl.classList.add("open");
              expEl.innerText = cached;
              return;
            }

            const slideCtx = findRelevantSlides(qObj.soru + " " + (qObj.siklar||[]).join(" "));
            const prompt = `İnönü Tıp Dönem 5 Nöroloji çıkmış sorusunu slayt kaynağına göre çöz ve açıkla.\nSoru: ${qObj.soru}\nŞıklar: ${(qObj.siklar||[]).join(" | ")}\nİlgili Slayt Kaynağı:\n${slideCtx}\n\nİlk satıra SADECE 'DOĞRU ŞIK: X' (X yerine A/B/C/D/E) yaz. Ardından:\n✅ NEDEN DOĞRU (MEKANİZMA & SLAYT BİLGİSİ):\n❌ DİĞER ŞIKLAR NEDEN YANLIŞ:\nbaşlıklarıyla net, öğretici açıklama yaz.`;

            callGroq(prompt, expEl, (ans) => {
              localStorage.setItem(cacheKey, ans);
              const m = ans.match(/DOĞRU\s*ŞIK\s*:\s*([A-E])/i);
              markButtons(m ? m[1].toUpperCase() : qObj.dogru_harf);
            });
          }

          function handleSozluClick(idx) {
            const qObj = CURRENT_LIST[idx];
            const expEl = document.getElementById("exp_" + idx);
            if (expEl.classList.contains("open")) {
              expEl.classList.remove("open");
              return;
            }
            const cacheKey = "vip_v9_s_" + qObj.soru.slice(0,55);
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
              expEl.classList.add("open");
              expEl.innerText = cached;
              return;
            }
            const slideCtx = findRelevantSlides(qObj.soru);
            const prompt = `İnönü Tıp Dönem 5 Nöroloji sözlü sorusuna slayt kaynağına göre tam puanlık hoca cevabı ver.\nSoru: ${qObj.soru}\nİlgili Slayt Kaynağı:\n${slideCtx}\n\n👨‍⚕️ HOCANIN DUYMAK İSTEDİĞİ CEVAP:\n📌 SLAYTTAKİ KRİTİK DETAY & TUZAK:\nbaşlıklarıyla maddeli, net açıklama yap.`;

            callGroq(prompt, expEl, (ans) => localStorage.setItem(cacheKey, ans));
          }

          function askCustomQuestion() {
            const qText = document.getElementById("customQInput").value.trim();
            if (!qText) return;
            const outEl = document.getElementById("customQAns");
            const slideCtx = findRelevantSlides(qText);
            const prompt = `Sen İnönü Tıp Dönem 5 Nöroloji profesörüsün. Öğrencinin sorduğu soruya verilen ders slaytlarını da dikkate alarak net, mekanizmalı ve öğretici cevap ver.\n\nÖğrencinin Sorusu: ${qText}\n\nİlgili Ders Slaytları:\n${slideCtx}\n\n🎯 NET CEVAP:\n📌 MEKANİZMA VE SLAYT AÇIKLAMASI:\n⚠️ SINAV / SÖZLÜ İPUCU:\nbaşlıklarıyla açıkla.`;
            callGroq(prompt, outEl, null);
          }

          function setMode(m) {
            MODE = m;
            SHOW_LIMIT = 60;
            ["tabTeorik","tabSozlu","tabAsk"].forEach(id => document.getElementById(id).classList.remove("active"));
            if(m==="TEORİK") document.getElementById("tabTeorik").classList.add("active");
            if(m==="SÖZLÜ") document.getElementById("tabSozlu").classList.add("active");
            if(m==="ASK") document.getElementById("tabAsk").classList.add("active");
            document.getElementById("searchWrap").style.display = (m === "ASK") ? "none" : "block";
            render();
          }

          function showMore() {
            SHOW_LIMIT += 60;
            render();
          }

          function render() {
            const box = document.getElementById("mainContainer");

            if (MODE === "ASK") {
              box.innerHTML = `<div class="ask-box">
                <div style="font-size:15px;font-weight:800;color:#60a5fa;margin-bottom:6px">💬 Nöroloji Slayt & TUS Asistanı</div>
                <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Aklına takılan soruyu veya çıkmış bir vakayı yaz; 23 slaydın tamamını tarayıp cevaplasın ve açıklasın.</div>
                <textarea id="customQInput" class="ask-area" placeholder="Örn: İskemik inmede tPA kontrendikasyonları nelerdir? veya Babinski eşdeğerlerini mekanizmasıyla açıkla..."></textarea>
                <button class="ask-submit" onclick="askCustomQuestion()">Soruma Cevap Ver ve Açıkla</button>
                <div class="ans-panel" id="customQAns"></div>
              </div>`;
              return;
            }

            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            CURRENT_LIST = ALL_Q.filter(q => {
              if (q.tur !== MODE) return false;
              if (query.length > 0) {
                const hay = (q.soru + " " + (q.siklar||[]).join(" ")).toLowerCase();
                return hay.includes(query);
              }
              return true;
            });

            if (CURRENT_LIST.length === 0) {
              box.innerHTML = `<p style="color:var(--muted);text-align:center;margin-top:40px">Bu aramada ${MODE.toLowerCase()} sorusu bulunamadı.</p>`;
              return;
            }

            const visible = CURRENT_LIST.slice(0, SHOW_LIMIT);
            let html = `<div class="info-bar"><span>${query ? `"${query}" için ` : ''}Toplam <b>${CURRENT_LIST.length}</b> ${MODE.toLowerCase()} sorusu</span><span>Gösterilen: ${visible.length}</span></div>`;

            visible.forEach((q, idx) => {
              html += `<div class="q-card" id="qcard_${idx}">
                <div class="q-stem">${idx+1}. ${q.soru}</div>`;

              if (MODE === "TEORİK" && q.siklar && q.siklar.length > 0) {
                q.siklar.forEach(opt => {
                  const letter = opt.trim().charAt(0).toUpperCase();
                  html += `<button class="opt" data-letter="${letter}" onclick="handleOptionClick(${idx}, '${letter}')">${opt}</button>`;
                });
                html += `<div class="ans-panel" id="exp_${idx}"></div>`;
              } else {
                html += `<button class="ans-btn" onclick="handleSozluClick(${idx})">👨‍⚕️ Cevabı ve Açıklamayı Gör</button>
                <div class="ans-panel" id="exp_${idx}" style="border-left-color:#f59e0b"></div>`;
              }
              html += `</div>`;
            });

            if (CURRENT_LIST.length > SHOW_LIMIT) {
              html += `<button class="more-btn" onclick="showMore()">Daha Fazla Göster (${CURRENT_LIST.length - SHOW_LIMIT} soru daha var)</button>`;
            }
            box.innerHTML = html;
          }

          init();
          </script>
          </body>
          </html>
          EOF

          python3 - << 'PYEOF'
          import os, json

          groq_key = os.environ.get("GROQ_API_KEY", "").strip()
          sorular = []
          if os.path.isfile("cikmis_arsiv.json"):
              with open("cikmis_arsiv.json", "r", encoding="utf-8", errors="ignore") as f:
                  sorular = json.load(f).get("sorular", [])

          slayt_txt = ""
          if os.path.isfile("noroloji_kaynak.txt"):
              with open("noroloji_kaynak.txt", "r", encoding="utf-8", errors="ignore") as f:
                  slayt_txt = f.read()

          with open("app/src/main/assets/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          html = html.replace("__GROQ_KEY_JSON__", json.dumps(groq_key))
          html = html.replace("__ALL_Q_JSON__", json.dumps(sorular, ensure_ascii=False).replace("</script>", "<\\/script>"))
          html = html.replace("__SLAYT_TEXT_JSON__", json.dumps(slayt_txt, ensure_ascii=False).replace("</script>", "<\\/script>"))

          with open("app/src/main/assets/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print(f"v9 HTML hazir: {len(sorular)} soru gomuldu!")
          PYEOF

          gradle assembleDebug --no-daemon

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: VIP-Noroloji-Cikmis-Master-v9
          path: app/build/outputs/apk/debug/app-debug.apk
