name: Cikmis Sorulari Tara ve Basliklandir

on:
  workflow_dispatch:

jobs:
  arsivle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: OCR ve Python Paketlerini Kur
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-tur
          pip install requests gdown pymupdf pytesseract pillow

      - name: Cikmis Kaynagini Tara ve Siniflandir
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > arsivle.py
          import os, re, json, time, subprocess, requests, fitz, pytesseract
          from PIL import Image
          import io

          GROQ_API_KEY = os.environ.get("GROQ_API_KEY", "").strip()
          CIKMIS_KLASOR_ID = "1qCju6jDTVNUT9Wj012UKOj3WWOZQTwbb"

          ham_metin = ""
          if os.path.isfile("noroloji_cikmis.txt"):
              with open("noroloji_cikmis.txt", "r", encoding="utf-8", errors="ignore") as f:
                  ham_metin = f.read().strip()

          # Eger metin bos veya cok kisaysa Drive'dan tekrar cekip gerekirse OCR uygula
          if len(ham_metin) < 500:
              print("Metin kisa/bos, Drive'dan cekilip OCR ile taranacak...", flush=True)
              os.makedirs("ham_cikmis", exist_ok=True)
              subprocess.run(["gdown", "--folder", f"https://drive.google.com/drive/folders/{CIKMIS_KLASOR_ID}", "-O", "ham_cikmis", "--remaining-ok"], check=False)
              pdfler = []
              for kok, _, dosyalar in os.walk("ham_cikmis"):
                  for d in sorted(dosyalar):
                      if d.lower().endswith(".pdf"):
                          pdfler.append(os.path.join(kok, d))
              satirlar_ocr = []
              for pdf_yol in pdfler:
                  doc = fitz.open(pdf_yol)
                  for s_no, sayfa in enumerate(doc, 1):
                      txt = sayfa.get_text("text").strip()
                      if len(txt) < 40:
                          pix = sayfa.get_pixmap(dpi=200)
                          img = Image.open(io.BytesIO(pix.tobytes("png")))
                          txt = pytesseract.image_to_string(img, lang="tur+eng").strip()
                      if txt:
                          satirlar_ocr.append(f"[Sayfa {s_no}]\n{txt}")
              ham_metin = "\n\n".join(satirlar_ocr)
              with open("noroloji_cikmis.txt", "w", encoding="utf-8") as out_t:
                  out_t.write(ham_metin)

          print(f"Toplam taranacak karakter: {len(ham_metin)}", flush=True)

          satirlar = [s.strip() for s in ham_metin.split("\n") if s.strip()]
          parcalar = []
          aktif = ""
          for s in satirlar:
              if len(aktif) + len(s) > 4500:
                  parcalar.append(aktif)
                  aktif = s
              else:
                  aktif += "\n" + s
          if aktif.strip():
              parcalar.append(aktif)

          def model_sec():
              try:
                  r = requests.get("https://api.groq.com/openai/v1/models", headers={"Authorization": f"Bearer {GROQ_API_KEY}"}, timeout=10)
                  if r.status_code == 200:
                      ids = [m["id"] for m in r.json().get("data", []) if not any(x in m["id"] for x in ["whisper", "guard", "tts", "8b"])]
                      for k in ["70b", "120b", "qwen", "gpt-oss", "deepseek"]:
                          bul = next((i for i in ids if k in i), None)
                          if bul:
                              return bul
              except Exception:
                  pass
              return "llama-3.3-70b-versatile"

          MODEL = model_sec()
          tum_sorular = []
          gorulen = set()

          for idx, parca in enumerate(parcalar, 1):
              print(f"Parca {idx}/{len(parcalar)} isleniyor...", flush=True)
              sistem = (
                  "Sen İnönü Tıp Dönem 5 Nöroloji arşiv uzmanısın. Sana verilen 'Çıkmış Nöroloji Föyü' metnindeki "
                  "TÜM soruları eksiksiz ayıkla. KESİNLİKLE yeni soru uydurma, sadece metinde geçen çıkmış soruları çıkar! "
                  "Her soruyu şu 5 alana ayır:\n"
                  "1. 'ana_baslik': Standart Nöroloji ana başlığı (Örn: Baş Ağrıları, Serebrovasküler Hastalıklar, Epilepsi, Hareket Bozuklukları, Demiyelinizan Hastalıklar, Nöromüsküler Hastalıklar, Bilinç Bozuklukları, Kraniyal Sinirler, SSS Enfeksiyonları, Demans ve Diğerleri)\n"
                  "2. 'alt_baslik': Spesifik alt konu (Örn: Migren, Küme Baş Ağrısı, Wallenberg Sendromu, GBS, CIDP, Myastenia Gravis, Parkinson, Status Epileptikus vb.)\n"
                  "3. 'tur': Çoktan seçmeli test sorusu ise 'TEORİK', açık uçlu / hoca sorusu / vaka sorusu ise 'SÖZLÜ'\n"
                  "4. 'soru': Çıkmış sorunun metni (varsa şıklarıyla birlikte)\n"
                  "5. 'cevap': Metinde cevabı varsa o cevap, yoksa tıbbi olarak kesin doğru cevabı ve 1 cümlelik açıklaması.\n"
                  "Metin içinde asla çift tırnak (\") kullanma. Sadece saf JSON döndür: "
                  '{"sorular":[{"ana_baslik":"...","alt_baslik":"...","tur":"TEORİK veya SÖZLÜ","soru":"...","cevap":"..."}]}'
              )
              for deneme in range(3):
                  try:
                      r = requests.post(
                          "https://api.groq.com/openai/v1/chat/completions",
                          headers={"Authorization": f"Bearer {GROQ_API_KEY}", "Content-Type": "application/json"},
                          json={
                              "model": MODEL,
                              "temperature": 0.1,
                              "max_tokens": 8000,
                              "response_format": {"type": "json_object"},
                              "messages": [{"role": "system", "content": sistem}, {"role": "user", "content": parca}]
                          },
                          timeout=30
                      )
                      if r.status_code == 200:
                          ham = re.sub(r'```json|```', '', r.json()["choices"][0]["message"]["content"]).strip()
                          veri = json.loads(ham, strict=False)
                          for q in veri.get("sorular", []):
                              anahtar = re.sub(r'\W+', '', q.get("soru", "").lower())[:55]
                              if anahtar and anahtar not in gorulen and q.get("cevap"):
                                  gorulen.add(anahtar)
                                  q["tur"] = "SÖZLÜ" if "SÖZLÜ" in q.get("tur", "").upper() else "TEORİK"
                                  tum_sorular.append(q)
                          break
                      else:
                          time.sleep(3)
                  except Exception:
                      time.sleep(2)
              time.sleep(1.5)

          with open("cikmis_arsiv.json", "w", encoding="utf-8") as out:
              json.dump({"toplam": len(tum_sorular), "sorular": tum_sorular}, out, ensure_ascii=False, indent=2)
          print(f"TAMAMLANDI! Toplam {len(tum_sorular)} cikmis soru arsivlendi.")
          EOF
          python arsivle.py
          rm -rf ham_cikmis arsivle.py

      - name: Arsivi Depoya Kaydet
        run: |
          git config user.name "VIP-Noroloji-Bot"
          git config user.email "tus@vip.local"
          git add cikmis_arsiv.json noroloji_cikmis.txt
          git commit -m "Cikmis Noroloji Sorulari OCR ile Tarandi ve Basliklandirildi"
          git push origin main
