name: Cikmis Sorulari Tara ve Basliklandir

on:
  workflow_dispatch:

jobs:
  arsivle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Tum Teorik ve Sozlu Sorulari Kayipsiz Topla
        run: |
          cat << 'EOF' > topla.py
          import re, json

          with open("noroloji_cikmis.txt", "r", encoding="utf-8", errors="ignore") as f:
              ham = f.read()

          # Sayfa/kaynak etiketlerini temizle ama satir yapisini koru
          temiz_satirlar = []
          for s in ham.split("\n"):
              s = re.sub(r'\s+', ' ', s).strip()
              if not s or s.startswith("===") or re.match(r'^\[Sayfa \d+\]$', s):
                  continue
              temiz_satirlar.append(s)

          metin = "\n".join(temiz_satirlar)
          tum_sorular = []
          gorulen = set()

          # 1. TEORIK SORULAR: Hem alt alta hem yan yana A) B) C) D) E) olan TUM sorulari yakala
          # Bir sonraki soru baslangicina kadar olan blogu tara
          parcalar = re.split(r'(?=\n(?:\d{1,3}[\.\-\)]\s+|[A-ZÇĞİÖŞÜ][^\n]{15,}\?))', "\n" + metin)

          for p in parcalar:
              p = p.strip()
              if len(p) < 25:
                  continue
              # Icinde a) b) c) d) (ve varsa e)) siklarini ara
              siklar_m = list(re.finditer(r'(?:^|\n|\s)([A-Ea-e])[\)\.\-]\s+', p))
              if len(siklar_m) >= 4:
                  # Ilk 'A)' sikkini bul
                  a_idx = next((i for i, m in enumerate(siklar_m) if m.group(1).upper() == 'A'), None)
                  if a_idx is None:
                      continue
                  secili = siklar_m[a_idx:a_idx+5]
                  if len(secili) < 4:
                      continue

                  soru_koku = p[:secili[0].start()].strip()
                  soru_koku = re.sub(r'^\d{1,3}[\.\-\)]\s*', '', soru_koku).strip()
                  if len(soru_koku) < 10:
                      continue

                  sik_listesi = []
                  dogru_harf = ""
                  for i, m in enumerate(secili):
                      harf = m.group(1).upper()
                      bas = m.end()
                      son = secili[i+1].start() if i+1 < len(secili) else len(p)
                      s_txt = p[bas:son].strip()
                      # Yildiz veya cevap anahtari varsa yakala
                      if "*" in s_txt or "✓" in s_txt:
                          dogru_harf = harf
                          s_txt = s_txt.replace("*", "").replace("✓", "").strip()
                      c_m = re.search(r'(?:Cevap|Doğru\s*Cevap|Yanıt)\s*[:\-]?\s*([A-E])', s_txt, re.I)
                      if c_m:
                          dogru_harf = c_m.group(1).upper()
                          s_txt = s_txt[:c_m.start()].strip()
                      # Sonraki sorunun ilk cumlesi sızdıysa kes
                      s_txt = re.split(r'\n\d{1,3}[\.\-\)]\s+', s_txt)[0].strip()
                      if s_txt:
                          sik_listesi.append(f"{harf}) {s_txt}")

                  if len(sik_listesi) >= 4:
                      anahtar = re.sub(r'\W+', '', soru_koku.lower())[:75]
                      if anahtar not in gorulen:
                          gorulen.add(anahtar)
                          tum_sorular.append({
                              "tur": "TEORİK",
                              "soru": soru_koku,
                              "siklar": sik_listesi,
                              "dogru_harf": dogru_harf
                          })

          # 2. SOZLU SORULARI: Sadece gercek sozlu sorularini al (duz ders notu cumlelerini ele)
          aktif_hoca = ""
          soru_fiilleri = ["anlat", "söyle", "say", "yap", "nedir", "nelerdir", "kriter", "tedavi", "tanı", "endikasyon", "kontrendikasyon", "muayene", "refleks", "dtr", "sınıfla", "fark", "neden", "komplikasyon", "yaklaşım", "bulgu", "belirti", "?"]
          not_fiilleri = ["kullanılır", "görülür", "saptanır", "oluşur", "yapılır", "verilir", "denir", "başlar", "artar", "azalır", "seyreder", "sık", "en önemli"]

          for s in temiz_satirlar:
              # Hoca adi tespiti
              if re.match(r'^[A-ZÇĞİÖŞÜ][a-zçğıöşü]+(?:\s+[A-ZÇĞİÖŞÜ][a-zçğıöşü]+){1,2}$', s) and len(s) < 32 and not any(k in s.lower() for k in ["inme", "demans", "migren", "epilepsi", "parkinson", "muayene", "sinir", "hastalık", "nöbet", "tedavi"]):
                  aktif_hoca = s
                  continue

              if re.match(r'^[A-Ea-e][\)\.\-]\s+', s) or any(x in s for x in ["A)", "B)", "C)", "D)", "a)", "b)", "c)", "d)"]):
                  continue
              if len(s) < 7 or len(s) > 150:
                  continue

              temiz_s = re.sub(r'^(?:\d{1,2}|[ivxIVX]{1,4})[\.\-\)]\s*', '', s).strip()
              low = temiz_s.lower()

              # Duz ders notu cumlesi ise atla
              if any(nf in low for nf in not_fiilleri) and "?" not in temiz_s and not any(sf in low for sf in ["anlat", "söyle", "say", "yap", "nedir", "nelerdir"]):
                  continue

              if any(sf in low for sf in soru_fiilleri):
                  anahtar = re.sub(r'\W+', '', temiz_s.lower())[:75]
                  if anahtar not in gorulen:
                      gorulen.add(anahtar)
                      tum_sorular.append({
                          "tur": "SÖZLÜ",
                          "soru": f"[{aktif_hoca}] {temiz_s}" if aktif_hoca else temiz_s,
                          "siklar": [],
                          "dogru_harf": ""
                      })

          with open("cikmis_arsiv.json", "w", encoding="utf-8") as out:
              json.dump({"toplam": len(tum_sorular), "sorular": tum_sorular}, out, ensure_ascii=False, indent=2)

          t_n = sum(1 for x in tum_sorular if x["tur"] == "TEORİK")
          s_n = sum(1 for x in tum_sorular if x["tur"] == "SÖZLÜ")
          print(f"TAMAM! Teorik: {t_n} | Sozlu: {s_n}")
          EOF
          python topla.py
          rm -f topla.py

      - name: Arsivi Depoya Kaydet
        run: |
          git config user.name "VIP-Noroloji-Bot"
          git config user.email "tus@vip.local"
          git add cikmis_arsiv.json
          git commit -m "Basliksiz temiz teorik ve sozlu arsiv olusturuldu"
          git push origin main
