name: Cikmis Sorulari Tara ve Basliklandir

on:
  workflow_dispatch:

jobs:
  arsivle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Tum Teorik ve Sozlu Sorulari Sifir Kayipla Ayikla (3 Saniye)
        run: |
          cat << 'EOF' > hizli_ayikla.py
          import os, re, json

          with open("noroloji_cikmis.txt", "r", encoding="utf-8", errors="ignore") as f:
              ham_metin = f.read()

          KONU_KURALLARI = [
              ("İskemik İnme", ["iskemik", "trombolitik", "tpa", "alteplaz", "mca", "aca", "pca", "laküner", "enfarkt", "inme", "serebrovasküler", "svh", "karotis", "nihss"]),
              ("Hemorajik İnme", ["hemorajik", "intraserebral", "subaraknoid", "sak", "anevrizma", "kanama", "hematom"]),
              ("Geçici İskemik Atak", ["geçici iskemik", "gia", "tia", "amarozis"]),
              ("Baş Ağrıları", ["baş ağrısı", "migren", "küme", "gerilim", "triptan", "ergotamin", "aura", "indometazin", "sunct", "paroksismal hemikrania"]),
              ("Epilepsi", ["epilepsi", "nöbet", "konvülziyon", "absans", "myoklonik", "tonik", "klonik", "valproat", "karbamazepin", "levetirasetam", "lamotrijin", "fenitoin", "eeg", "janz"]),
              ("Status Epileptikus", ["status epileptikus", "status"]),
              ("Parkinson Hastalığı", ["parkinson", "levodopa", "l-dopa", "bradikinezi", "istirahat tremoru", "rijidite", "substantia nigra", "ropinirol", "pramipeksol"]),
              ("Ekstrapiramidal Sistem Hastalıkları", ["ekstrapiramidal", "distoni", "kore", "huntington", "tremor", "esansiyel tremor", "wilson", "tik", "tourette", "ataks"]),
              ("Demans", ["demans", "alzheimer", "lewy", "frontotemporal", "normal basınçlı hidrosefali", "nbh", "donepezil", "memantin", "rivastigmin", "mmse"]),
              ("MS ve Demiyelinizan Hastalıklar", ["multipl skleroz", "ms ", "demiyelinizan", "optik nörit", "oligoklonal", "mcdonald", "interferon", "natalizumab", "fingolimod", "devic", "nmo"]),
              ("Myastenia Gravis", ["myastenia", "myasteni", "mg ", "asetilkolin", "piridostigmin", "timoma", "edrofonyum", "tensilon", "oküler"]),
              ("ALS", ["als", "amyotrofik", "motor nöron", "riluzol", "fasikülasyon"]),
              ("PNP ve GBS", ["gbs", "guillain", "polinöropati", "pnp", "albüminositolojik", "ivig", "plazmaferez", "aksonal", "periferik sinir"]),
              ("CIDP", ["cidp", "kronik inflamatuar"]),
              ("Kas Hastalıkları", ["kas", "miyopati", "distrofi", "duchenne", "becker", "miyotonik", "polimiyozit", "dermatomiyozit", "cpk", "ck "]),
              ("Bilinç Bozuklukları", ["bilinç", "koma", "stupor", "letarji", "glasgow", "gks", "beyin ölümü", "vejetatif", "locked-in"]),
              ("Kraniyal Sinirler ve Nevralji", ["kraniyal", "kranial", "trigeminal", "nevralji", "fasiyal", "bell", "okulomotor", "troklear", "abducens", "optik", "göz hareket", "pupilla", "horner", "diplopi", "nistagmus"]),
              ("Yüksek Kortikal İşlev Bozukluğu", ["kortikal", "afazi", "broca", "wernicke", "apraksi", "agnozi", "ihmal", "neglect"]),
              ("Nörolojik Muayene ve Diğerleri", ["dtr", "refleks", "babinski", "serebellar", "muayene", "duyu", "menenjit", "ensefalit", "bos", "lomber ponksiyon"])
          ]

          def konu_bul(metin):
              low = " " + metin.lower() + " "
              en_iyi, maks = "Nörolojik Muayene ve Diğerleri", 0
              for baslik, kelimeler in KONU_KURALLARI:
                  skor = sum(low.count(k) for k in kelimeler)
                  if skor > maks:
                      maks = skor
                      en_iyi = baslik
              return en_iyi

          # Metni satir satir temizle
          satirlar = [re.sub(r'\s+', ' ', s).strip() for s in ham_metin.split("\n")]
          satirlar = [s for s in satirlar if s and not s.startswith("===") and not re.match(r'^\[Sayfa \d+\]$', s)]

          tum_sorular = []
          gorulen = set()

          # 1. TEORIK COKTAN SECMELI SORULARI AYIKLA (A, B, C, D, E sikli tum bloklar)
          tam_blok = "\n".join(satirlar)
          # Soru numarasi ile baslayip A) B) C) D) E) iceren bloklari yakala
          soru_bloklari = re.split(r'(?=\n\d{1,3}[\.\-\)]\s+)', "\n" + tam_blok)

          for blok in soru_bloklari:
              blok = blok.strip()
              if not blok:
                  continue
              # Icinde sik kalibi var mi kontrol et
              sik_eslesme = list(re.finditer(r'(?:^|\n|\s)([A-Ea-e])[\)\.\-]\s+', blok))
              if len(sik_eslesme) >= 4:
                  ilk_sik_pos = sik_eslesme[0].start()
                  soru_koku = blok[:ilk_sik_pos].strip()
                  soru_koku = re.sub(r'^\d{1,3}[\.\-\)]\s*', '', soru_koku).strip()
                  if len(soru_koku) < 12:
                      continue

                  siklar = []
                  dogru_harf = ""
                  for i, m in enumerate(sik_eslesme):
                      harf = m.group(1).upper()
                      bas = m.end()
                      son = sik_eslesme[i+1].start() if i+1 < len(sik_eslesme) else len(blok)
                      sik_metni = blok[bas:son].strip()
                      # Yildiz (*) veya (doğru) isaretini yakala
                      if "*" in sik_metni or "✓" in sik_metni or "(doğru)" in sik_metni.lower():
                          dogru_harf = harf
                          sik_metni = sik_metni.replace("*", "").replace("✓", "").strip()
                      # Cevap anahtari satirini ayir
                      cevap_not = re.search(r'(?:Cevap|Doğru\s*Cevap)\s*[:\-]?\s*([A-E])', sik_metni, re.I)
                      if cevap_not:
                          dogru_harf = cevap_not.group(1).upper()
                          sik_metni = sik_metni[:cevap_not.start()].strip()
                      if len(siklar) < 5 and sik_metni:
                          siklar.append(f"{harf}) {sik_metni}")

                  if len(siklar) >= 4:
                      anahtar = re.sub(r'\W+', '', soru_koku.lower())[:70]
                      if anahtar not in gorulen:
                          gorulen.add(anahtar)
                          tum_sorular.append({
                              "slayt_baslik": konu_bul(soru_koku + " " + " ".join(siklar)),
                              "tur": "TEORİK",
                              "soru": soru_koku,
                              "siklar": siklar,
                              "dogru_harf": dogru_harf,
                              "aciklama": ""
                          })

          # 2. SOZLU / HOCA SORULARINI AYIKLA (Siksiz, kisa, tek satirlik maddeler ve hoca basliklari)
          aktif_hoca = ""
          sozlu_ipucu = ["anlat", "söyle", "say", "yap", "nedir", "nelerdir", "kriter", "tedavi", "tanı", "endikasyon", "kontrendikasyon", "muayene", "refleks", "dtr", "sinir", "belirti", "bulgu", "sınıfla", "fark", "neden", "komplikasyon", "yaklaşım", "?"]

          for s in satirlar:
              # Hoca adi mi? (2-3 kelimelik ozel isim satiri, rakamsiz, soru isaretsiz)
              if re.match(r'^[A-ZÇĞİÖŞÜ][a-zçğıöşü]+(?:\s+[A-ZÇĞİÖŞÜ][a-zçğıöşü]+){1,2}$', s) and len(s) < 35 and not any(k in s.lower() for k in ["inme", "demans", "migren", "epilepsi", "parkinson", "muayene", "sinir", "hastalık", "nöbet", "tedavi"]):
                  aktif_hoca = s
                  continue

              # Sik satiri veya uzun paragraf ise atla
              if re.match(r'^[A-Ea-e][\)\.\-]\s+', s) or len(s) > 160 or len(s) < 6:
                  continue
              if any(x in s for x in ["A)", "B)", "C)", "D)", "E)"]):
                  continue

              temiz_s = re.sub(r'^\d{1,2}[\.\-\)]\s*', '', s).strip()
              if len(temiz_s) < 6:
                  continue

              low_s = temiz_s.lower()
              if any(ip in low_s for ip in sozlu_ipucu) or re.match(r'^\d{1,2}[\.\-\)]\s*', s):
                  anahtar = re.sub(r'\W+', '', temiz_s.lower())[:70]
                  if anahtar not in gorulen:
                      gorulen.add(anahtar)
                      etiketli_soru = f"[{aktif_hoca}] {temiz_s}" if aktif_hoca else temiz_s
                      tum_sorular.append({
                          "slayt_baslik": konu_bul(temiz_s),
                          "tur": "SÖZLÜ",
                          "soru": etiketli_soru,
                          "siklar": [],
                          "dogru_harf": "",
                          "aciklama": ""
                      })

          with open("cikmis_arsiv.json", "w", encoding="utf-8") as out:
              json.dump({"toplam": len(tum_sorular), "sorular": tum_sorular}, out, ensure_ascii=False, indent=2)

          t_say = sum(1 for x in tum_sorular if x["tur"] == "TEORİK")
          s_say = sum(1 for x in tum_sorular if x["tur"] == "SÖZLÜ")
          print(f"3 SANIYEDE BITTI! Toplam: {len(tum_sorular)} | Teorik: {t_say} | Sozlu: {s_say}")
          EOF
          python hizli_ayikla.py
          rm -f hizli_ayikla.py

      - name: Arsivi Depoya Kaydet
        run: |
          git config user.name "VIP-Noroloji-Bot"
          git config user.email "tus@vip.local"
          git add cikmis_arsiv.json
          git commit -m "Sifir kayipli hizli teorik ve sozlu arsiv olusturuldu"
          git push origin main
