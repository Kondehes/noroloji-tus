name: Cikmis Sorulari Tara ve Basliklandir

on:
  workflow_dispatch:

jobs:
  arsivle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Teorik ve Sozlu Sorulari Kesin Ayir ve Sifir Kayipla Topla
        run: |
          cat << 'EOF' > topla.py
          import re, json

          with open("noroloji_cikmis.txt", "r", encoding="utf-8", errors="ignore") as f:
              ham = f.read()

          gurultu = [
              "camscanner", "wps office", "edit with wps", "öğrencinin adı", "sınav tarihi",
              "aldığı puan", "imzası", "kolay gelsin", "soruların cevaplarında hata",
              "meyus ve ümitsiz", "her şeyi maddede", "ey muhammed", "kullarıma", "yorum yap vurgula"
          ]

          satirlar = []
          for s in ham.split("\n"):
              s = re.sub(r'\s+', ' ', s).strip()
              if not s or s.startswith("===") or re.match(r'^\[Sayfa \d+\]$', s):
                  continue
              if any(g in s.lower() for g in gurultu):
                  continue
              if re.match(r'^\d{2}:\d{2}$', s) or "LTE" in s or "Çok kez iletildi" in s or "İletildi" in s:
                  continue
              satirlar.append(s)

          tum_sorular = []
          gorulen = set()
          mod = "TEORİK"
          aktif_hoca = ""
          sozlu_satir_sayaci = 0

          hoca_isimleri = [
              "ahmet adıgüzel", "ahmet hoca", "fatma ebru", "ebru hoca", "ebru alagül", "ebru algül",
              "yüksel kablan", "yüksel kaplan", "mehmet tecellioğlu", "mehmet hoca",
              "suat kamışlı", "özden kamışlı", "abdülcemal özcan", "abdulcemal özcan"
          ]

          SORU_BAS_RE = re.compile(r'^(?:#\s*)?(?:SORU\s+|Soru\s+)?(\d{1,3})\s*[\)\.\-\:]+\s*(.+)$')
          SIK_RE = re.compile(r'^(?:[\(\[]?([A-Ea-e])[\)\.\-\:\]]+)\s*(.+)$')

          kok_buf = []
          siklar_buf = []
          dogru_harf = ""

          def teorik_kaydet(kok_list, sik_list, harf):
              if not kok_list:
                  return
              koku = " ".join(kok_list).strip()
              koku = re.sub(r'^(?:#\s*)?(?:SORU\s+|Soru\s+)?\d{1,3}\s*[\)\.\-\:]+\s*', '', koku).strip()
              if len(koku) < 15:
                  return
              cevap_notu = ""
              for line in kok_list:
                  cm = re.search(r'(?:Cevap|Doğru\s*cevap)\s*[:\=\-\)]\s*(.+)', line, re.I)
                  if cm:
                      cevap_notu = cm.group(1).strip()

              if len(sik_list) < 2 and not cevap_notu and "?" not in koku and "hangisi" not in koku.lower():
                  return

              anahtar = re.sub(r'\W+', '', koku.lower())[:85]
              if anahtar in gorulen:
                  return
              gorulen.add(anahtar)

              if cevap_notu and not sik_list:
                  sik_list = [f"A) {cevap_notu}"]
                  harf = "A"

              tum_sorular.append({
                  "tur": "TEORİK",
                  "soru": koku,
                  "siklar": sik_list[:5],
                  "dogru_harf": harf
              })

          for idx, s in enumerate(satirlar):
              low = s.lower()

              # 1) Sözlü başlığı veya hoca adı geçerse SÖZLÜ modunu aç
              if re.match(r'^(?:#\s*)?sözlü(?:\s+soruları|\s+sınavı|\s+25-26.*)?$', low):
                  teorik_kaydet(kok_buf, siklar_buf, dogru_harf)
                  kok_buf, siklar_buf, dogru_harf = [], [], ""
                  mod = "SÖZLÜ"
                  sozlu_satir_sayaci = 0
                  continue

              hoca_bulundu = next((h for h in hoca_isimleri if h in low and len(s) < 42), None)
              if hoca_bulundu:
                  teorik_kaydet(kok_buf, siklar_buf, dogru_harf)
                  kok_buf, siklar_buf, dogru_harf = [], [], ""
                  mod = "SÖZLÜ"
                  aktif_hoca = re.sub(r'^[#\-\•\*]+\s*', '', s).strip()
                  sozlu_satir_sayaci = 0
                  continue

              # 2) SÖZLÜ modundayken teorik bir test sorusu başlarsa ANINDA TEORİK moduna geri dön!
              if mod == "SÖZLÜ":
                  # Sınav başlığı, A) şıkkı, "aşağıdakilerden hangisi" veya 60 satırdan fazla ilerlediyse SÖZLÜ biter
                  teorik_basladi = (
                      bool(SIK_RE.match(s)) or
                      "aşağıdakilerden" in low or
                      "hangisi yanlıştır" in low or
                      "hangisi doğrudur" in low or
                      "hangileri yanlıştır" in low or
                      "hangileri doğrudur" in low or
                      any(k in low for k in ["grup", "teorik", "staj", "sınav", "telafi", "dönem v", "whatsapp", "sıraya yazılan"]) or
                      sozlu_satir_sayaci > 45
                  )
                  if teorik_basladi:
                      mod = "TEORİK"
                      aktif_hoca = ""
                  else:
                      sozlu_satir_sayaci += 1
                      temiz_sozlu = re.sub(r'^(?:[#\-\•\*]+|\d{1,2}\s*(?:numara|vaka)?[\)\.\-\:]?)\s*', '', s, flags=re.I).strip()
                      if len(temiz_sozlu) < 6 or len(temiz_sozlu) > 150:
                          continue
                      if temiz_sozlu.startswith(("→", "↳", "✓", "X")):
                          continue
                      anahtar = re.sub(r'\W+', '', temiz_sozlu.lower())[:85]
                      if anahtar not in gorulen:
                          gorulen.add(anahtar)
                          tum_sorular.append({
                              "tur": "SÖZLÜ",
                              "soru": f"[{aktif_hoca}] {temiz_sozlu}" if aktif_hoca else temiz_sozlu,
                              "siklar": [],
                              "dogru_harf": ""
                          })
                      continue

              # 3) TEORİK MODU:
              yy = list(re.finditer(r'(?:^|\s)([A-Ea-e])[\)\.\-]\s*', s))
              if len(yy) >= 3 and yy[0].group(1).upper() == 'A':
                  bas_kisim = s[:yy[0].start()].strip()
                  if bas_kisim:
                      kok_buf.append(bas_kisim)
                  yy_siklar, yy_harf = [], ""
                  for i, m in enumerate(yy[:5]):
                      h = m.group(1).upper()
                      st = s[m.end():(yy[i+1].start() if i+1 < len(yy[:5]) else len(s))].strip()
                      if "*" in st or "✓" in st:
                          yy_harf = h
                          st = st.replace("*", "").replace("✓", "").strip()
                      yy_siklar.append(f"{h}) {st}")
                  teorik_kaydet(kok_buf, yy_siklar, yy_harf)
                  kok_buf, siklar_buf, dogru_harf = [], [], ""
                  continue

              m_sik = SIK_RE.match(s)
              if m_sik and (kok_buf or siklar_buf):
                  h = m_sik.group(1).upper()
                  st = m_sik.group(2).strip()
                  if h == 'A' and len(siklar_buf) >= 3:
                      teorik_kaydet(kok_buf, siklar_buf, dogru_harf)
                      kok_buf, siklar_buf, dogru_harf = [], [], ""
                  if "*" in st or "✓" in st or "(doğru" in st.lower():
                      dogru_harf = h
                      st = st.replace("*", "").replace("✓", "").strip()
                  siklar_buf.append(f"{h}) {st}")
                  continue

              m_soru = SORU_BAS_RE.match(s)
              if m_soru:
                  num_val = int(m_soru.group(1))
                  if len(siklar_buf) >= 2:
                      teorik_kaydet(kok_buf, siklar_buf, dogru_harf)
                      kok_buf, siklar_buf, dogru_harf = [s], [], ""
                      continue
                  if kok_buf and (num_val > 6 or "?" in " ".join(kok_buf) or "hangisi" in " ".join(kok_buf).lower()):
                      teorik_kaydet(kok_buf, siklar_buf, dogru_harf)
                      kok_buf, siklar_buf, dogru_harf = [s], [], ""
                      continue

              if siklar_buf and len(siklar_buf) < 5 and not s.endswith("?") and "hangisi" not in low:
                  siklar_buf[-1] += " " + s
              else:
                  if len(siklar_buf) >= 2:
                      teorik_kaydet(kok_buf, siklar_buf, dogru_harf)
                      kok_buf, siklar_buf, dogru_harf = [], [], ""
                  kok_buf.append(s)

          teorik_kaydet(kok_buf, siklar_buf, dogru_harf)

          with open("cikmis_arsiv.json", "w", encoding="utf-8") as out:
              json.dump({"toplam": len(tum_sorular), "sorular": tum_sorular}, out, ensure_ascii=False, indent=2)

          t_n = sum(1 for x in tum_sorular if x["tur"] == "TEORİK")
          s_n = sum(1 for x in tum_sorular if x["tur"] == "SÖZLÜ")
          print(f"TAMAMLANDI! Benzersiz Teorik: {t_n} | Benzersiz Sozlu: {s_n}")
          EOF
          python topla.py
          rm -f topla.py

      - name: Arsivi Depoya Kaydet
        run: |
          git config user.name "VIP-Noroloji-Bot"
          git config user.email "tus@vip.local"
          git add cikmis_arsiv.json
          git commit -m "Teorik ve Sozlu modu kilidi duzeltildi"
          git push origin main
