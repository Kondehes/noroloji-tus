name: Cikmis Sorulari Tara ve Basliklandir

on:
  workflow_dispatch:

jobs:
  arsivle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Gerekli Paketleri Kur
        run: |
          pip install requests

      - name: Tum Sorulari Slayt Basliklarina Gore Kayipsiz Ayikla
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > arsivle.py
          import os, re, json, time, requests

          GROQ_API_KEY = os.environ.get("GROQ_API_KEY", "").strip()
          with open("noroloji_cikmis.txt", "r", encoding="utf-8", errors="ignore") as f:
              cikmis_metin = f.read().strip()

          slayt_metin = ""
          if os.path.isfile("noroloji_kaynak.txt"):
              with open("noroloji_kaynak.txt", "r", encoding="utf-8", errors="ignore") as fs:
                  slayt_metin = fs.read().strip()

          SLAYT_BASLIKLARI = [
              "İskemik İnme",
              "Hemorajik İnme",
              "Geçici İskemik Atak",
              "Baş Ağrıları",
              "Epilepsi",
              "Status Epileptikus",
              "Parkinson Hastalığı",
              "Ekstrapiramidal Sistem Hastalıkları",
              "Demans",
              "MS ve Demiyelinizan Hastalıklar",
              "Myastenia Gravis",
              "ALS",
              "PNP ve GBS",
              "CIDP",
              "Kas Hastalıkları",
              "Bilinç Bozuklukları",
              "Kraniyal Sinirler ve Nevralji",
              "Minimental Durum Muayenesi",
              "Yüksek Kortikal İşlev Bozukluğu",
              "Nörolojik Muayene ve Diğerleri"
          ]

          satirlar = [s.strip() for s in cikmis_metin.split("\n") if s.strip()]
          parcalar = []
          aktif = ""
          for s in satirlar:
              if len(aktif) + len(s) > 1800:
                  parcalar.append(aktif)
                  aktif = s
              else:
                  aktif += "\n" + s
          if aktif.strip():
              parcalar.append(aktif)

          print(f"Toplam parca sayisi: {len(parcalar)}", flush=True)

          def model_sec():
              try:
                  r = requests.get("https://api.groq.com/openai/v1/models", headers={"Authorization": f"Bearer {GROQ_API_KEY}"}, timeout=10)
                  if r.status_code == 200:
                      ids = [m["id"] for m in r.json().get("data", []) if not any(x in m["id"] for x in ["whisper", "guard", "tts", "8b"])]
                      for k in ["70b", "120b", "qwen", "gpt-oss", "deepseek"]:
                          bul = next((i for i in ids if k in i), None)
                          if bul:
                              return bul
              except Exception:
                  pass
              return "llama-3.3-70b-versatile"

          def ilgili_slayt_bul(metin):
              if not slayt_metin:
                  return ""
              kelimeler = [w for w in set(re.findall(r'[a-zA-ZçğıöşüÇĞİÖŞÜ]{4,}', metin.lower())) if w not in ["anlat", "nedir", "nelerdir", "söyle", "hangisi", "yanlıştır", "doğrudur", "aşağıdakilerden", "hastada", "tedavide", "tanıda", "görülür", "değildir", "muayenesi", "muayeneyi"]]
              if not kelimeler:
                  return ""
              bolumler = slayt_metin.split("=== KONU:")
              skorlu = []
              for b in bolumler[1:]:
                  b_low = b.lower()
                  skor = sum(b_low.count(k) for k in kelimeler[:10])
                  if skor > 0:
                      skorlu.append((skor, b[:2200]))
              skorlu.sort(reverse=True, key=lambda x: x[0])
              return "\n---\n".join([x[1] for x in skorlu[:2]])

          MODEL = model_sec()
          tum_sorular = []
          gorulen = set()
          baslik_str = ", ".join(SLAYT_BASLIKLARI)

          for idx, parca in enumerate(parcalar, 1):
              print(f"Parca {idx}/{len(parcalar)} isleniyor (Toplam: {len(tum_sorular)} soru)...", flush=True)
              slayt_baglami = ilgili_slayt_bul(parca)
              sistem = (
                  "Sen İnönü Tıp Dönem 5 Nöroloji profesörü ve TUS eğitmenisin. "
                  "Sana verilen metindeki HİÇBİR soruyu atlamadan TEK TEK çıkar. KESİNLİKLE yeni soru uydurma!\n"
                  "Metinde iki tür öğe vardır:\n"
                  "1) 'TEORİK': Çoktan seçmeli test soruları (A, B, C, D, E şıklı).\n"
                  "2) 'SÖZLÜ': Hoca isimlerinin altındaki şıksız kısa sözlü/muayene maddeleri (örn: 'MG anlat', 'Dtrleri söyle', 'Trombolitik endikasyonları', '5. Kranial sinir muayenesi' vb.). Her satır/madde AYRI bir SÖZLÜ sorusudur!\n\n"
                  "Her soru için şu JSON alanlarını eksiksiz üret (ALT BAŞLIK YOKTUR, sadece verilen slayt başlıklarından birini seç):\n"
                  f"- 'slayt_baslik': SADECE şu listeden en uygun olanı seç: [{baslik_str}]\n"
                  "- 'tur': Çoktan seçmeli ise 'TEORİK', şıksız kısa madde/hoca sorusu ise 'SÖZLÜ'\n"
                  "- 'soru': Soru kökü (TEORİK ise şıkları bu alana YAZMA, şıkları 'siklar' dizisine koy; SÖZLÜ ise varsa hoca adıyla birlikte soruyu yaz, örn: '[Yüksel Kablan] Migren anlat')\n"
                  "- 'siklar': TEORİK ise ['A) ...', 'B) ...', 'C) ...', 'D) ...', 'E) ...'] şeklinde 5 şık dizisi; SÖZLÜ ise [] (boş dizi)\n"
                  "- 'dogru_harf': TEORİK ise doğru şıkkın sadece büyük harfi ('A', 'B', 'C', 'D' veya 'E'); SÖZLÜ ise ''\n"
                  "- 'aciklama': Slayt kaynağına dayalı detaylı TUS/Hoca açıklaması:\n"
                  "   * TEORİK ise: DOĞRU CEVAP NEDENİ: [Fizyopatoloji/anatomi mekanizması ve slayttaki net bilgi] | DİĞER ŞIKLAR & SINAV TUZAĞI: [Yanlış şıkların neden elendiği]\n"
                  "   * SÖZLÜ ise: HOCANIN DUYMAK İSTEDİĞİ MADDELER: [Sözlüde tam puan aldıran ana başlıklar/muayene adımları] | SLAYT KRİTİK NOTU: [Slayttaki ayırt ettirici ipucu]\n"
                  "JSON içinde çift tırnak (\") kullanma (tek tırnak kullan). Sadece saf JSON döndür: "
                  '{"sorular":[{"slayt_baslik":"...","tur":"TEORİK","soru":"...","siklar":["A) ...","B) ...","C) ...","D) ...","E) ..."],"dogru_harf":"A","aciklama":"..."}]}'
              )
              kullanici_icerik = f"ÇIKMIŞ ARŞİV METNİ:\n{parca}\n\nİLGİLİ DERS SLAYTI KAYNAĞI:\n{slayt_baglami}"
              for deneme in range(3):
                  try:
                      r = requests.post(
                          "https://api.groq.com/openai/v1/chat/completions",
                          headers={"Authorization": f"Bearer {GROQ_API_KEY}", "Content-Type": "application/json"},
                          json={
                              "model": MODEL,
                              "temperature": 0.1,
                              "max_tokens": 8000,
                              "response_format": {"type": "json_object"},
                              "messages": [{"role": "system", "content": sistem}, {"role": "user", "content": kullanici_icerik}]
                          },
                          timeout=45
                      )
                      if r.status_code == 200:
                          ham = re.sub(r'```json|```', '', r.json()["choices"][0]["message"]["content"]).strip()
                          veri = json.loads(ham, strict=False)
                          for q in veri.get("sorular", []):
                              soru_metni = q.get("soru", "").strip()
                              anahtar = re.sub(r'\W+', '', soru_metni.lower())[:70]
                              if anahtar and anahtar not in gorulen and q.get("aciklama"):
                                  gorulen.add(anahtar)
                                  sb = q.get("slayt_baslik", "").strip()
                                  if sb not in SLAYT_BASLIKLARI:
                                      sb = "Nörolojik Muayene ve Diğerleri"
                                  siklar = q.get("siklar", [])
                                  harf = str(q.get("dogru_harf", "")).strip().upper()[:1]
                                  tur = "TEORİK" if (isinstance(siklar, list) and len(siklar) >= 3 and harf in ["A","B","C","D","E"]) else "SÖZLÜ"
                                  tum_sorular.append({
                                      "slayt_baslik": sb,
                                      "tur": tur,
                                      "soru": soru_metni,
                                      "siklar": siklar if tur == "TEORİK" else [],
                                      "dogru_harf": harf if tur == "TEORİK" else "",
                                      "aciklama": q.get("aciklama", "").strip()
                                  })
                          break
                      else:
                          time.sleep(4)
                  except Exception:
                      time.sleep(2)
              time.sleep(1.5)

          with open("cikmis_arsiv.json", "w", encoding="utf-8") as out:
              json.dump({"toplam": len(tum_sorular), "sorular": tum_sorular}, out, ensure_ascii=False, indent=2)
          teorik_n = sum(1 for x in tum_sorular if x["tur"] == "TEORİK")
          sozlu_n = sum(1 for x in tum_sorular if x["tur"] == "SÖZLÜ")
          print(f"TAMAMLANDI! Toplam: {len(tum_sorular)} | Teorik: {teorik_n} | Sozlu: {sozlu_n}")
          EOF
          python arsivle.py
          rm -f arsivle.py

      - name: Arsivi Depoya Kaydet
        run: |
          git config user.name "VIP-Noroloji-Bot"
          git config user.email "tus@vip.local"
          git add cikmis_arsiv.json
          git commit -m "Slayt bazli TUS quiz ve sozlu arsivi olusturuldu"
          git push origin main
